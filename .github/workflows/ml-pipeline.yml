name: ml-pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      epochs:
        description: "Кількість епох навчання"
        default: "10"
      push_image:
        description: "Опублікувати образ у GHCR"
        type: boolean
        default: false

# Новий коміт у тій самій гілці скасовує попередній запуск
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Найменші привілеї за замовчуванням; ширші права — лише job build-push
permissions:
  contents: read

env:
  # PR: коротке навчання; main: повне; ручний запуск: значення з UI
  EPOCHS: >-
    ${{ inputs.epochs
    || (github.event_name == 'pull_request' && '2' || '10') }}
  MIN_ACCURACY: ${{ github.event_name == 'pull_request' && '60' || '80' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.6.9 && ruff check src/ scripts/

  train:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      accuracy: ${{ steps.metrics.outputs.accuracy }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build trainer image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: trainer
          load: true
          tags: kws-trainer:ci
          cache-from: type=gha,scope=trainer
          cache-to: type=gha,mode=max,scope=trainer

      - name: Train in container
        run: |
          set -o pipefail
          mkdir -p artifacts
          docker run --rm -v "$PWD/artifacts:/artifacts" kws-trainer:ci \
            --classes yes no up down --epochs "$EPOCHS" --seed 42 \
            --out /artifacts 2>&1 | tee artifacts/train.log

      - name: Training metrics
        id: metrics
        run: |
          ACC=$(jq '.accuracy' artifacts/metrics.json)
          echo "accuracy=$ACC" >> "$GITHUB_OUTPUT"
          {
            echo "### Training"
            echo "| epochs | accuracy, % | model size, KB | train time, s |"
            echo "|---|---|---|---|"
            jq -r '"| \(.epochs) | \(.accuracy) | \(.model_size_kb) | \(.train_time_s) |"' artifacts/metrics.json
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload model
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model
          path: artifacts/
          retention-days: 14
          if-no-files-found: error

  verify:
    needs: train
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        with:
          name: model
          path: artifacts/

      - name: Build runtime image
        run: docker build --target runtime --build-arg GIT_SHA=${GITHUB_SHA::7} -t kws-api:ci .

      - name: Start service
        run: |
          docker run -d --name kws -p 8000:8000 kws-api:ci
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health && exit 0
            sleep 2
          done
          exit 1

      - name: Golden-sample check
        run: |
          pip install requests==2.32.3
          python scripts/verify_model.py --url http://localhost:8000 \
            --expected samples/expected.json --out metrics/verify.json

      - name: Quality gate (accuracy)
        run: |
          curl -sf http://localhost:8000/model-info | tee metrics/model-info.json
          echo
          jq -e ".accuracy >= $MIN_ACCURACY" metrics/model-info.json

      - name: Latency benchmark
        run: |
          python scripts/benchmark.py --url http://localhost:8000 \
            --n 100 --warmup 10 --out metrics/latency.json

      - name: Report
        if: always()
        run: |
          mkdir -p metrics
          docker logs kws > metrics/service.log 2>&1 || true
          python scripts/make_report.py --metrics metrics/ \
            --model-metrics artifacts/metrics.json --out metrics/report.md
          cat metrics/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: metrics/
          retention-days: 14

  build-push:
    needs: verify
    if: github.event_name == 'push' || inputs.push_image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: model
          path: artifacts/

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/kws-api
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: true
          build-args: GIT_SHA=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,mode=max,scope=runtime

      - name: Image summary
        run: |
          {
            echo "### Published image"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo "digest: ${{ steps.build.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
